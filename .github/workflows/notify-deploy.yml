name: Notify deploy

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send update
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL_ID }}
          MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          title=$(printf '%s' "$MSG" | head -n1 | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g')
          text="🆕 <b>На сайте обновление</b>

          📝 $title
          🌐 https://promtly-ru.github.io/"
          for chat in "$TG_CHANNEL" "$TG_CHAT"; do
            [ -n "$chat" ] && curl -s -m 20 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=$chat" --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=$text"
          done
          exit 0

name: Telegram bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# новый запуск встаёт в очередь и стартует, когда предыдущий завершится (без двух опросчиков одновременно)
concurrency:
  group: tg-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL_ID }}
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SITE_URL: https://promtly-ru.github.io/
        run: python3 bot/server.py

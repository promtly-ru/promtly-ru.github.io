name: Telegram bot

on:
  schedule:
    - cron: "50 */5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tg-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python bot/bot.py

name: Telegram leave channel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leave:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -s "https://api.telegram.org/bot${TG_TOKEN}/leaveChat" -d chat_id="${TG_CHANNEL}"
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL_ID }}

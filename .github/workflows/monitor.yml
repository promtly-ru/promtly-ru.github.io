name: Site monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://promtly-ru.github.io/

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check site
        id: check
        run: |
          ok=0; code=000; ms=0
          for i in 1 2 3; do
            out=$(curl -s -o /dev/null -m 15 -w '%{http_code} %{time_total}' "$SITE_URL" || true)
            code=${out%% *}
            ms=$(awk -v t="${out##* }" 'BEGIN{printf "%d", t*1000}')
            echo "attempt $i: $code ${ms}ms"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "ms=$ms" >> "$GITHUB_OUTPUT"

      - name: Alerts and commands
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT_ID }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL_ID }}
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SITE_OK: ${{ steps.check.outputs.ok }}
          SITE_CODE: ${{ steps.check.outputs.code }}
          SITE_MS: ${{ steps.check.outputs.ms }}
        run: python3 bot/monitor.py

      - name: Fail job when site is down
        if: steps.check.outputs.ok != '1'
        run: exit 1

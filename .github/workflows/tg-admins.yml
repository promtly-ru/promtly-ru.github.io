name: Telegram resolve channel

on:
  workflow_dispatch:
    inputs:
      username:
        description: Channel username without @
        default: promptly398

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          A="https://api.telegram.org/bot${TG_TOKEN}"
          curl -s "$A/getChat?chat_id=@${UNAME}" | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('result',{});print('RES',d.get('ok'),d.get('description',''),r.get('id'),r.get('type'),r.get('title'))"
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          UNAME: ${{ inputs.username }}

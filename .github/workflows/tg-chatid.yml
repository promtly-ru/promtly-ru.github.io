name: Telegram chat id

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: List chats
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/getWebhookInfo" | head -c 300; echo
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/getMe" | head -c 200; echo
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/getUpdates?allowed_updates=%5B%22message%22,%22channel_post%22,%22my_chat_member%22%5D" |
          python3 -c "
          import sys,json
          for u in json.load(sys.stdin).get('result',[]):
              m=u.get('channel_post') or u.get('message') or u.get('my_chat_member') or {}
              c=m.get('chat',{})
              print(list(u)[1], c.get('id'), c.get('type'), c.get('title') or c.get('username'))
          "
